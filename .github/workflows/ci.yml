name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these same checks before it builds anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Production dependency tree only; dev-side advisories are tracked by Dependabot.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx vite build

  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-08-05
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'src-tauri -> target'
      - run: npm run rust:fmt:check
      # rust:lint and rust:test stage the dist folder and the sidecar stand-in themselves.
      - run: npm run rust:lint
      # The runner image ships Chrome and Edge, so a missing browser fails the capture tests.
      - run: npm run rust:test
        env:
          MYNK_REQUIRE_BROWSER: '1'
      # The shipped license list is read from both dependency graphs, so it needs node_modules too.
      - run: npm ci
      - run: npm run licenses -- --check

  # Linux is not packaged, but the Rust side is built and run there from source. Only this job
  # sees the XDG directory split and the `cfg` arms the Windows jobs compile out.
  rust-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev
      # The rust:* scripts use Node built-ins only, so no npm install is needed here.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-08-05
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'src-tauri -> target'
      - run: npm run rust:fmt:check
      - run: npm run rust:lint
      # ubuntu-latest ships google-chrome, so a missing browser fails the capture tests here too.
      - run: npm run rust:test
        env:
          MYNK_REQUIRE_BROWSER: '1'

  # Release-profile compile of the app and the mynk-mcp sidecar, stopping before the bundler: the
  # NSIS step needs the updater signing key, which only the tag-driven release workflow holds.
  release-build:
    # Not when the release workflow calls this for a tag: that one builds the release itself.
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: [frontend, rust]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-08-05
        with:
          toolchain: 1.97.1
      # The npm script below applies the same flags itself; exporting them here only keeps them in
      # the cache key, so a release build can reuse what the previous one compiled.
      - run: node scripts/build-env.mjs --github-env
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'src-tauri -> target'
      - run: npm ci
      # beforeBuildCommand builds the frontend and the real mynk-mcp binary. The script routes the
      # build through scripts/build-env.mjs, which remaps build paths and then scans the binaries.
      - run: npm run tauri:build -- --no-bundle
